name: APK release

on:
  push:
    branches: [main]
  # En los PR solo compila y corre los tests, para detectar errores antes del merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner ya trae el SDK de Android (ANDROID_HOME); el plugin de Android
      # baja solo la plataforma y las build-tools que falten.
      - name: Licencias del SDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # La release va optimizada con R8 y el Baseline Profile, firmada con la misma clave
      # (app/debug.keystore) que las builds anteriores: se instala encima sin perder el progreso.
      - name: Tests y APK release
        run: ./gradlew --no-daemon testDebugUnitTest :app:assembleRelease

      # TEMPORAL (se revierte antes del merge): imprime las capturas del PR en base64.
      - name: Capturas (temporal)
        if: always()
        run: |
          shopt -s nullglob; for f in app/build/capturas/*.png; do echo "=== $(basename "$f")"; base64 -w 120 "$f"; echo "=== fin"; done

      - name: Renombrar APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk "correlativas-mecanica-${{ github.run_number }}.apk"

      - name: Publicar release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Correlativas Mecánica 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK release (optimizado con R8 y Baseline Profile) compilado desde ${{ github.sha }}.
            Desde el celular: descargá el `.apk` de abajo y abrilo para instalar (Android te va a pedir permiso para instalar apps de esta fuente).
          files: correlativas-mecanica-${{ github.run_number }}.apk
